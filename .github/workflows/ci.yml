name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter photocn build
      - run: pnpm test
      # The site build generates content-collections, which typecheck needs.
      - run: pnpm --filter www build
        env:
          NEXT_PUBLIC_SITE_URL: https://photocn.dev
      - run: pnpm typecheck

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter photocn build
      - run: pnpm --filter www build
      - run: pnpm --filter www exec playwright install --with-deps chromium
      - run: pnpm --filter www test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/www/test-results
